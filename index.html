<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헤븐인 업무일정</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef1fb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="헤븐인">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<base target="_blank">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --ink: #1c2340; --sub: #5a6282; --line: rgba(255,255,255,.65);
    --glass: rgba(255,255,255,.52); --glass-strong: rgba(255,255,255,.78);
    --navy: #232c63; --gold: #f2b63c; --blue: #3f6fe0; --green: #1f9d78; --amber: #c98512; --red: #d2484f;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
    color: var(--ink); font-size: 16px; line-height: 1.55;
    background:
      radial-gradient(60vmax 60vmax at 8% 0%, #c9d6ff 0%, transparent 60%),
      radial-gradient(55vmax 55vmax at 100% 20%, #ffe3c2 0%, transparent 60%),
      radial-gradient(60vmax 60vmax at 40% 100%, #c8f1e4 0%, transparent 60%),
      #eef1fb;
    background-attachment: fixed;
  }
  /* 미묘한 노이즈 질감 */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .22; mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 14px 120px; }
  .glass {
    background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius);
    -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 30px rgba(40,50,110,.10), inset 0 1px 0 rgba(255,255,255,.6);
  }
  header.top { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--navy); color: var(--gold); display: grid; place-items: center; font-size: 13px; letter-spacing: .5px; flex: none; }
  header.top h1 { font-size: 19px; margin: 0; font-weight: 700; }
  header.top p { margin: 0; font-size: 13px; color: var(--sub); }
  .icon-btn { margin-left: auto; border: 1px solid var(--line); background: var(--glass-strong); border-radius: 14px; height: 44px; padding: 0 14px; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; }

  .tabs { display: flex; gap: 6px; padding: 6px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 1 0 auto; border: 0; background: transparent; font: inherit; font-size: 15px; color: var(--sub); padding: 10px 14px; border-radius: 16px; cursor: pointer; white-space: nowrap; }
  .tab.on { background: var(--glass-strong); color: var(--ink); box-shadow: 0 4px 14px rgba(40,50,110,.12); }
  .tools { display: flex; gap: 8px; margin-bottom: 14px; }
  .tools input { flex: 1; min-width: 0; }
  input, textarea, select {
    font: inherit; color: var(--ink); width: 100%; padding: 12px 14px; border-radius: 14px;
    border: 1px solid rgba(120,130,180,.28); background: rgba(255,255,255,.72); outline: none;
  }
  input:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(63,111,224,.16); }
  textarea { resize: vertical; min-height: 92px; }
  .chip { border: 1px solid rgba(120,130,180,.28); background: rgba(255,255,255,.6); border-radius: 999px; padding: 9px 14px; font: inherit; font-size: 14px; color: var(--sub); cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }

  .card { padding: 16px; margin-bottom: 12px; }
  .card .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .badge { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; color: #fff; }
  .b-시공일정 { background: var(--blue); } .b-보수일정 { background: var(--green); } .b-화성본드 { background: var(--amber); }
  .date { font-size: 14px; color: var(--sub); }
  .dday { font-size: 12.5px; color: var(--red); margin-left: auto; }
  .card h2 { font-size: 18px; font-weight: 600; margin: 2px 0 8px; word-break: keep-all; }
  dl { margin: 0; display: grid; grid-template-columns: 58px 1fr; gap: 3px 10px; font-size: 15px; }
  dt { color: var(--sub); } dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  dd a { color: var(--blue); text-decoration: none; }
  .thumbs { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; }
  .thumbs img, .thumbs .ph { width: 92px; height: 92px; border-radius: 14px; object-fit: cover; flex: none; background: rgba(255,255,255,.6); border: 1px solid var(--line); cursor: zoom-in; }
  .acts { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .acts .by { font-size: 12.5px; color: var(--sub); margin-right: auto; }
  .mini { border: 1px solid rgba(120,130,180,.28); background: rgba(255,255,255,.6); border-radius: 12px; padding: 7px 12px; font: inherit; font-size: 13.5px; color: var(--ink); cursor: pointer; }
  .mini.danger { color: var(--red); }
  .empty { text-align: center; color: var(--sub); padding: 40px 16px; }

  .fab { position: fixed; z-index: 5; right: max(16px, calc(50% - 364px)); bottom: calc(20px + env(safe-area-inset-bottom)); height: 58px; padding: 0 24px; border-radius: 999px; border: 0; background: var(--navy); color: #fff; font: inherit; font-size: 17px; box-shadow: 0 12px 28px rgba(35,44,99,.35); cursor: pointer; }
  .fab b { color: var(--gold); font-weight: 700; margin-right: 6px; }

  .sheet-bg { position: fixed; inset: 0; z-index: 10; background: rgba(28,35,64,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: none; align-items: flex-end; justify-content: center; }
  .sheet-bg.on { display: flex; }
  .sheet { width: 100%; max-width: 760px; max-height: 94vh; overflow-y: auto; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0; background: rgba(245,247,255,.9); }
  @media (min-width: 800px) { .sheet-bg { align-items: center; } .sheet { border-radius: 26px; } }
  .sheet h3 { margin: 0 0 12px; font-size: 19px; font-weight: 700; display: flex; align-items: center; }
  .sheet h3 button { margin-left: auto; }
  .seg { display: flex; gap: 6px; margin-bottom: 14px; }
  .seg .chip { flex: 1; text-align: center; font-size: 15px; padding: 11px 6px; }
  label.f { display: block; font-size: 13.5px; color: var(--sub); margin: 12px 0 5px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .item { display: grid; grid-template-columns: 1fr 74px 78px 96px 38px; gap: 6px; margin-bottom: 6px; }
  .item.nob { grid-template-columns: 1fr 84px 84px 38px; }
  .item input, .item select { padding: 11px 9px; min-width: 0; }
  .item button, .x { border: 0; background: rgba(210,72,79,.12); color: var(--red); border-radius: 12px; font-size: 18px; cursor: pointer; }
  @media (max-width: 520px) { .item { grid-template-columns: 1fr 1fr 1fr 38px; } .item input:first-child, .item select:first-child { grid-column: 1 / -1; } .item.nob { grid-template-columns: 1fr 1fr 38px; } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick { position: relative; width: 92px; height: 92px; flex: none; }
  .pick img { width: 100%; height: 100%; border-radius: 14px; object-fit: cover; }
  .pick .x { position: absolute; top: -6px; right: -6px; width: 28px; height: 28px; border-radius: 50%; background: var(--red); color: #fff; font-size: 15px; }
  .addph { width: 92px; height: 92px; border-radius: 14px; border: 1.5px dashed rgba(90,98,130,.5); display: grid; place-items: center; color: var(--sub); font-size: 14px; cursor: pointer; flex: none; text-align: center; background: rgba(255,255,255,.5); }
  .primary { width: 100%; height: 54px; border: 0; border-radius: 16px; background: var(--navy); color: #fff; font: inherit; font-size: 17px; margin-top: 18px; cursor: pointer; }
  .primary:disabled { opacity: .55; }
  details.paste { margin-bottom: 8px; padding: 10px 14px; border-radius: 16px; background: rgba(255,255,255,.55); border: 1px solid var(--line); }
  details.paste summary { cursor: pointer; font-size: 14.5px; color: var(--sub); }
  .toast { position: fixed; z-index: 30; left: 50%; bottom: 96px; transform: translateX(-50%); background: rgba(28,35,64,.92); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; text-align: center; }
  .toast.on { opacity: 1; }
  .viewer { position: fixed; inset: 0; z-index: 20; background: rgba(15,18,35,.9); display: none; place-items: center; }
  .viewer.on { display: grid; }
  .viewer img { max-width: 96vw; max-height: 92vh; border-radius: 12px; }
  .hide { display: none !important; }
  /* 뷰어 권한: 글쓰기 · 수정 · 삭제 버튼을 숨깁니다 */
  body.role-viewer .fab, body.role-viewer [data-a="edit"], body.role-viewer [data-a="del"], body.role-viewer [data-a="copy"] { display: none !important; }
  /* 댓글 */
  .clist { margin-top: 12px; padding-top: 4px; border-top: 1px solid rgba(120,130,180,.2); }
  .cmt { padding: 9px 0; }
  .cmt + .cmt { border-top: 1px dashed rgba(120,130,180,.2); }
  .cmt-h { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); }
  .cmt-h b { color: var(--ink); font-weight: 600; }
  .cmt-h button { margin-left: auto; border: 0; background: none; color: var(--red); font: inherit; font-size: 12.5px; cursor: pointer; padding: 2px 4px; }
  .cmt-t { margin-top: 3px; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .cmt .thumbs { margin-top: 8px; }
  .cmt .thumbs img { width: 76px; height: 76px; }
  .cbox { margin-top: 12px; }
  .cbox textarea { min-height: 70px; }
  .cpicks { margin-top: 6px; padding-top: 6px; }
  .cpicks:empty { display: none; }
  .cbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .mini.prim { background: var(--navy); border-color: var(--navy); color: #fff; }
  .mini:disabled { opacity: .55; }

  /* ---------- 랜딩(접속) 화면 ---------- */
  .gate {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; overflow: hidden;
    background:
      radial-gradient(60vmax 60vmax at 8% 0%, #c9d6ff 0%, transparent 60%),
      radial-gradient(55vmax 55vmax at 100% 20%, #ffe3c2 0%, transparent 60%),
      radial-gradient(60vmax 60vmax at 40% 100%, #c8f1e4 0%, transparent 60%),
      #eef1fb;
    transition: opacity .45s ease, visibility .45s ease;
  }
  .gate.off { opacity: 0; visibility: hidden; }
  .gate-in { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; }
  .drop { width: min(46vw, 190px); aspect-ratio: 1; transform: translateY(-120vh); animation: drop 1.8s linear .25s forwards; }
  .gate-logo { width: 100%; height: 100%; display: block; border-radius: 50%; transform-origin: 50% 100%; filter: drop-shadow(0 14px 22px rgba(10,23,78,.28)); animation: squash 1.8s linear .25s both; }
  .gate-shadow { width: 120px; height: 12px; margin-top: 10px; border-radius: 50%; background: rgba(10,23,78,.2); filter: blur(4px); opacity: 0; transform: scale(.3); animation: shade 1.8s linear .25s forwards; }
  /* 떨어진 뒤 두 번 튀고 멈춥니다 */
  @keyframes drop {
    0% { transform: translateY(-120vh); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
    42% { transform: translateY(0); animation-timing-function: cubic-bezier(0, .55, .45, 1); }
    60% { transform: translateY(-62%); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
    76% { transform: translateY(0); animation-timing-function: cubic-bezier(0, .55, .45, 1); }
    88% { transform: translateY(-24%); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
    100% { transform: translateY(0); }
  }
  @keyframes squash {
    0%, 40% { transform: scale(1, 1); }
    43% { transform: scale(1.14, .84); }
    52% { transform: scale(1, 1); }
    74% { transform: scale(1, 1); }
    77% { transform: scale(1.08, .9); }
    84%, 100% { transform: scale(1, 1); }
  }
  @keyframes shade {
    0% { opacity: 0; transform: scale(.3); }
    42% { opacity: 1; transform: scale(1); }
    60% { opacity: .35; transform: scale(.55); }
    76% { opacity: 1; transform: scale(1); }
    88% { opacity: .6; transform: scale(.75); }
    100% { opacity: 1; transform: scale(1); }
  }
  .gate-card { width: 100%; margin-top: 22px; padding: 20px; text-align: center; opacity: 0; transform: translateY(12px); animation: rise .5s ease 2.15s forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .gate-card h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .gate-card p { margin: 4px 0 14px; font-size: 14px; color: var(--sub); }
  #gateCode { text-align: center; font-size: 20px; letter-spacing: 6px; -webkit-text-security: disc; }
  #gateCode.shake { animation: shake .4s; border-color: var(--red); }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  .gate-msg { min-height: 20px; margin-top: 8px; font-size: 13.5px; color: var(--red); }
  @media (prefers-reduced-motion: reduce) {
    .drop, .gate-logo, .gate-shadow, .gate-card { animation-duration: .01s; animation-delay: 0s; }
  }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-in">
    <div class="drop"><img class="gate-logo" src="icon-512.png" alt="헤븐인 로고"></div>
    <div class="gate-shadow"></div>
    <form class="gate-card glass" id="gateForm" autocomplete="off">
      <h2>헤븐인 업무일정</h2>
      <p>접속코드를 입력해 주세요</p>
      <input id="gateCode" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="접속코드" aria-label="접속코드">
      <button class="primary" id="gateBtn" type="submit">들어가기</button>
      <div class="gate-msg" id="gateMsg"></div>
    </form>
  </div>
</div>
<div class="wrap">
  <header class="top glass">
    <img class="logo" src="icon-512.png" alt="" style="border-radius:50%">
    <div><h1>헤븐인 업무일정</h1><p id="sub">불러오는 중…</p></div>
    <button class="icon-btn" id="btnReload">새로고침</button>
  </header>

  <nav class="tabs glass" id="tabs">
    <button class="tab on" data-t="전체">전체</button>
    <button class="tab" data-t="시공일정">시공일정</button>
    <button class="tab" data-t="보수일정">보수일정</button>
    <button class="tab" data-t="화성본드">화성본드</button>
  </nav>
  <div class="tools">
    <input id="q" type="search" placeholder="현장명, 업체명, 주소, 인원 검색">
    <button class="chip" id="upc">다가오는 일정</button>
  </div>
  <main id="list"></main>
</div>

<button class="fab" id="fab"><b>＋</b>글쓰기</button>

<div class="sheet-bg" id="bg">
  <section class="sheet glass">
    <h3><span id="ftitle">새 글 쓰기</span><button class="mini" id="btnClose">닫기</button></h3>
    <div class="seg" id="seg">
      <button class="chip on" data-t="시공일정">시공일정</button>
      <button class="chip" data-t="보수일정">보수일정</button>
      <button class="chip" data-t="화성본드">화성본드</button>
    </div>

    <details class="paste" id="pasteBox">
      <summary>밴드 형식 글 붙여넣기 (자동으로 칸 채우기)</summary>
      <textarea id="pasteTxt" placeholder="#시공일정 2026년 11월 12일 (목)&#10;담당자 : …&#10;업체명 : …" style="margin-top:8px"></textarea>
      <button class="mini" id="btnParse" style="margin-top:6px">칸 채우기</button>
    </details>

    <div class="row2">
      <div><label class="f">일자 *</label><input type="date" id="fDate"></div>
      <div class="only-total"><label class="f">종료일 (여러 날일 때)</label><input type="date" id="fEnd"></div>
    </div>
    <div class="row2 only-total">
      <div><label class="f">거래처</label><input id="fClient" list="dlClient" placeholder="예: 유앤어스"></div>
      <div><label class="f">담당자</label><input id="fManager" placeholder="예: 노태훈 차장"></div>
    </div>
    <div class="only-total"><label class="f">업체명</label><input id="fCompany"></div>
    <label class="f">현장명</label><input id="fSite">
    <div class="only-total"><label class="f">주소</label><input id="fAddr"></div>

    <label class="f" id="lblItems">내용 (내역 · 단위 · 수량 · 단가)</label>
    <div id="items"></div>
    <button class="mini" id="btnAddItem">＋ 내역 추가</button>

    <div class="only-total">
      <label class="f">소장 (이름 · 연락처)</label><input id="fChief">
      <label class="f">인원</label>
      <div class="chips" id="workers"></div>
      <input id="fWorkerEtc" placeholder="목록에 없는 인원 (쉼표로 구분)" style="margin-top:8px">
    </div>
    <label class="f" id="lblNote">기타</label><textarea id="fNote" placeholder="1. 도착 시간&#10;2. 주차 안내"></textarea>

    <label class="f">사진 (최대 10장)</label>
    <div class="thumbs" id="picks" style="margin-top:0;padding-top:6px"></div>
    <input type="file" id="file" accept="image/*" multiple class="hide">

    <label class="f">작성자</label><input id="fAuthor" list="dlWorker" placeholder="이름">
    <button class="primary" id="btnSave">등록하기</button>
  </section>
</div>

<datalist id="dlClient"></datalist><datalist id="dlWorker"></datalist><datalist id="dlUnit"></datalist>
<div class="viewer" id="viewer"><img id="viewImg" alt="사진"></div>
<div class="toast" id="toast"></div>

<script>
var S = { code: '', cfg: { workers: [], clients: [], units: [] }, entries: [], tab: '전체', q: '', upc: false, imgs: {} };
var F = { id: '', type: '시공일정', keep: [], news: [], picked: {} };
var $ = function (id) { return document.getElementById(id); };
var WD = ['일', '월', '화', '수', '목', '금', '토'];

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function rich(s) { return esc(s).replace(/(01[016789][- ]?\d{3,4}[- ]?\d{4})/g, function (m) { return '<a href="tel:' + m.replace(/[^\d]/g, '') + '" target="_top">' + m + '</a>'; }); }
function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove('on'); }, 2600); }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function nice(d) { if (!/^\d{4}-\d{2}-\d{2}/.test(d)) return d; var x = new Date(d.slice(0, 10) + 'T00:00:00'); return x.getFullYear() + '년 ' + (x.getMonth() + 1) + '월 ' + x.getDate() + '일 (' + WD[x.getDay()] + ')'; }
var API = 'https://script.google.com/macros/s/AKfycbyi7qyGBloWlyzilhxT63JSwaMWUuLksYX4km49evavfQyUwipPIyp7XZw1uhlkQKvF1A/exec';
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },

}

// 접속코드가 바뀌었거나 맞지 않으면 내용을 지우고 접속 화면으로 돌아갑니다.

function match(e) {

  if (m) { var p2 = function (n) { return ('0' + n).slice(-2); }; $('fDate').value = m[1] + '-' + p2(m[2]) + '-' + p2(m[3]); $('fEnd').value = m[4] ? m[1] + '-' + p2(m[2]) + '-' + p2(m[4]) : ''; }
  var keys = ['담당자', '업체명', '현장명', '주소', '내용', '소장', '인원', '기타'], got = {};
  var re = new RegExp('(' + keys.join('|') + ')\\s*[:：]', 'g'), marks = [], x;
  while ((x = re.exec(t))) marks.push({ k: x[1], s: x.index, e: re.lastIndex });
  marks.forEach(function (mk, i) { if (!got[mk.k]) got[mk.k] = t.slice(mk.e, i + 1 < marks.length ? marks[i + 1].s : t.length).trim(); });
  if (got['담당자'] !== undefined) {
    var who = got['담당자'], cl = S.cfg.clients.filter(function (c) { return who.indexOf(c) === 0; })[0];
    $('fClient').value = cl || ''; $('fManager').value = cl ? who.slice(cl.length).trim() : who;
  }
  if (got['업체명'] !== undefined) $('fCompany').value = got['업체명'];
  if (got['현장명'] !== undefined) $('fSite').value = got['현장명'];
  if (got['주소'] !== undefined) $('fAddr').value = got['주소'].replace(/\s*\n\s*/g, ' ');
  if (got['소장'] !== undefined) $('fChief').value = got['소장'].replace(/\s*\n\s*/g, ' ');
  if (got['기타'] !== undefined) $('fNote').value = got['기타'].replace(/[ \t]+(?=\d{1,2}\.\s)/g, '\n').trim();
  if (got['내용'] !== undefined) {
    var body = got['내용'].replace(/\s*\n\s*/g, ' '), q = body.match(/([\d,]+(?:\.\d+)?)\s*(m2|㎡|m²|장|박스|통|롤)/i);
    $('items').innerHTML = '';
    addItem({ name: body, qty: q ? q[1].replace(/,/g, '') : '', unit: q ? q[2].replace(/㎡|m²/, 'm2') : '' });
  }
  if (got['인원'] !== undefined) {
    var ws = got['인원'].split(/[,\s]+/).filter(String), known = [], etc = [], buf = [];
    ws.forEach(function (w) { if (S.cfg.workers.indexOf(w) >= 0) known.push(w); else buf.push(w); });
    if (buf.length) etc.push(buf.join(' '));
    drawWorkers(known); $('fWorkerEtc').value = etc.join(', ');
  }
  toast('칸을 채웠습니다. 내용을 확인해 주세요');
};

$('btnSave').onclick = function () {
  var bond = F.type === '화성본드';
  if (!$('fDate').value) { toast('일자를 입력해 주세요'); return; }
  if (!bond && !$('fSite').value.trim()) { toast('현장명을 입력해 주세요'); return; }
  var end = $('fEnd').value;
  if (!bond && end && end < $('fDate').value) { toast('종료일이 일자보다 빠릅니다'); return; }
  var workers = S.cfg.workers.filter(function (w) { return F.picked[w]; });
  $('fWorkerEtc').value.split(',').forEach(function (w) { w = w.trim(); if (w) workers.push(w); });
  var d = {
    id: F.id, type: F.type, date: $('fDate').value, endDate: bond ? '' : end,
    client: $('fClient').value, manager: $('fManager').value, company: $('fCompany').value,
    site: $('fSite').value, address: $('fAddr').value, items: readItems(),
    chief: $('fChief').value, workers: workers.join(', '), note: $('fNote').value,
    author: $('fAuthor').value.trim(), keep: F.keep.map(function (p) { return p.f; }), photos: F.news
  };
  store('hia_author', d.author);
  var btn = $('btnSave'); btn.disabled = true; btn.textContent = F.news.length ? '사진 올리는 중…' : '저장 중…';
  call('saveEntry', d).then(function () {
    $('bg').classList.remove('on'); toast(F.id ? '수정했습니다' : '등록했습니다. 시트에 정리되었습니다'); load();
  }).catch(function (e) { toast('저장하지 못했습니다: ' + (e && e.message || e)); })
    .then(function () { btn.disabled = false; btn.textContent = F.id ? '수정 저장' : '등록하기'; });
};

// 접속코드는 저장하지 않습니다. 웹앱을 열 때마다 입력해야 내용이 보입니다.
try { localStorage.removeItem('hia_code'); } catch (e) {}
$('gateForm').onsubmit = function (ev) {
  ev.preventDefault();
  var box = $('gateCode'), btn = $('gateBtn'), v = box.value.trim();
  if (!v) { box.focus(); return; }
  S.code = v; btn.disabled = true; btn.textContent = '확인 중…'; $('gateMsg').textContent = '';
  load(function (ok, msg) {
    btn.disabled = false; btn.textContent = '들어가기'; box.value = '';
    if (ok) { $('gate').classList.add('off'); box.blur(); return; }
    S.code = ''; $('gateMsg').textContent = msg;
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); box.focus();
  });
};
$('sub').textContent = '접속코드 필요';
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
