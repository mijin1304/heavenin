<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헤븐인 업무일정</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef1fb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="헤븐인">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<base target="_blank">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --ink: #1c2340; --sub: #5a6282; --line: rgba(255,255,255,.65);
    --glass: rgba(255,255,255,.52); --glass-strong: rgba(255,255,255,.78);
    --navy: #232c63; --gold: #f2b63c; --blue: #3f6fe0; --green: #1f9d78; --amber: #c98512; --red: #d2484f;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
    color: var(--ink); font-size: 16px; line-height: 1.55;
    background:
      radial-gradient(60vmax 60vmax at 8% 0%, #c9d6ff 0%, transparent 60%),
      radial-gradient(55vmax 55vmax at 100% 20%, #ffe3c2 0%, transparent 60%),
      radial-gradient(60vmax 60vmax at 40% 100%, #c8f1e4 0%, transparent 60%),
      #eef1fb;
    background-attachment: fixed;
  }
  /* 미묘한 노이즈 질감 */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .22; mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 14px 120px; }
  .glass {
    background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius);
    -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 30px rgba(40,50,110,.10), inset 0 1px 0 rgba(255,255,255,.6);
  }
  header.top { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--navy); color: var(--gold); display: grid; place-items: center; font-size: 13px; letter-spacing: .5px; flex: none; }
  header.top h1 { font-size: 19px; margin: 0; font-weight: 700; }
  header.top p { margin: 0; font-size: 13px; color: var(--sub); }
  .icon-btn { margin-left: auto; border: 1px solid var(--line); background: var(--glass-strong); border-radius: 14px; height: 44px; padding: 0 14px; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; }

  .tabs { display: flex; gap: 6px; padding: 6px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 1 0 auto; border: 0; background: transparent; font: inherit; font-size: 15px; color: var(--sub); padding: 10px 14px; border-radius: 16px; cursor: pointer; white-space: nowrap; }
  .tab.on { background: var(--glass-strong); color: var(--ink); box-shadow: 0 4px 14px rgba(40,50,110,.12); }
  .tools { display: flex; gap: 8px; margin-bottom: 14px; }
  .tools input { flex: 1; min-width: 0; }
  input, textarea, select {
    font: inherit; color: var(--ink); width: 100%; padding: 12px 14px; border-radius: 14px;
    border: 1px solid rgba(120,130,180,.28); background: rgba(255,255,255,.72); outline: none;
  }
  input:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(63,111,224,.16); }
  textarea { resize: vertical; min-height: 92px; }
  .chip { border: 1px solid rgba(120,130,180,.28); background: rgba(255,255,255,.6); border-radius: 999px; padding: 9px 14px; font: inherit; font-size: 14px; color: var(--sub); cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }

  .card { padding: 16px; margin-bottom: 12px; }
  .card .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .badge { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; color: #fff; }
  .b-시공일정 { background: var(--blue); } .b-보수일정 { background: var(--green); } .b-화성본드 { background: var(--amber); }
  .date { font-size: 14px; color: var(--sub); }
  .dday { font-size: 12.5px; color: var(--red); margin-left: auto; }
  .card h2 { font-size: 18px; font-weight: 600; margin: 2px 0 8px; word-break: keep-all; }
  dl { margin: 0; display: grid; grid-template-columns: 58px 1fr; gap: 3px 10px; font-size: 15px; }
  dt { color: var(--sub); } dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  dd a { color: var(--blue); text-decoration: none; }
  .thumbs { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; }
  .thumbs img, .thumbs .ph { width: 92px; height: 92px; border-radius: 14px; object-fit: cover; flex: none; background: rgba(255,255,255,.6); border: 1px solid var(--line); cursor: zoom-in; }
  .acts { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .acts .by { font-size: 12.5px; color: var(--sub); margin-right: auto; }
  .mini { border: 1px solid rgba(120,130,180,.28); background: rgba(255,255,255,.6); border-radius: 12px; padding: 7px 12px; font: inherit; font-size: 13.5px; color: var(--ink); cursor: pointer; }
  .mini.danger { color: var(--red); }
  .empty { text-align: center; color: var(--sub); padding: 40px 16px; }

  .fab { position: fixed; z-index: 5; right: max(16px, calc(50% - 364px)); bottom: calc(20px + env(safe-area-inset-bottom)); height: 58px; padding: 0 24px; border-radius: 999px; border: 0; background: var(--navy); color: #fff; font: inherit; font-size: 17px; box-shadow: 0 12px 28px rgba(35,44,99,.35); cursor: pointer; }
  .fab b { color: var(--gold); font-weight: 700; margin-right: 6px; }

  .sheet-bg { position: fixed; inset: 0; z-index: 10; background: rgba(28,35,64,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: none; align-items: flex-end; justify-content: center; }
  .sheet-bg.on { display: flex; }
  .sheet { width: 100%; max-width: 760px; max-height: 94vh; overflow-y: auto; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0; background: rgba(245,247,255,.9); }
  @media (min-width: 800px) { .sheet-bg { align-items: center; } .sheet { border-radius: 26px; } }
  .sheet h3 { margin: 0 0 12px; font-size: 19px; font-weight: 700; display: flex; align-items: center; }
  .sheet h3 button { margin-left: auto; }
  .seg { display: flex; gap: 6px; margin-bottom: 14px; }
  .seg .chip { flex: 1; text-align: center; font-size: 15px; padding: 11px 6px; }
  label.f { display: block; font-size: 13.5px; color: var(--sub); margin: 12px 0 5px; }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .row2 > * { min-width: 0; }
  /* 모바일(아이폰) 날짜 칸이 옆 칸과 겹치지 않게 */
  input[type="date"] { display: block; min-width: 0; max-width: 100%; min-height: 48px; -webkit-appearance: none; appearance: none; text-align: left; }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
  input[type="date"]::-webkit-calendar-picker-indicator { margin-left: 2px; }
  @media (max-width: 420px) { .row2 label.f { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } input[type="date"] { padding-left: 10px; padding-right: 8px; font-size: 15px; } }
  /* 선택 목록 (설정 탭 목록) — PC · 모바일 공통 */
  .sug { position: fixed; z-index: 70; display: none; max-height: 240px; overflow-y: auto; padding: 5px; border-radius: 16px; background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); border: 1px solid var(--line); box-shadow: 0 16px 36px rgba(40,50,110,.2); -webkit-overflow-scrolling: touch; }
  .sug.on { display: block; }
  .sug button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 11px 12px; border-radius: 11px; font: inherit; font-size: 15px; color: var(--ink); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sug button:hover, .sug button.act { background: rgba(63,111,224,.1); }
  .item { display: grid; grid-template-columns: 1fr 74px 78px 96px 38px; gap: 6px; margin-bottom: 6px; }
  .item.nob { grid-template-columns: 1fr 84px 84px 38px; }
  .item input, .item select { padding: 11px 9px; min-width: 0; }
  .item button, .x { border: 0; background: rgba(210,72,79,.12); color: var(--red); border-radius: 12px; font-size: 18px; cursor: pointer; }
  @media (max-width: 520px) { .item { grid-template-columns: 1fr 1fr 1fr 38px; } .item input:first-child, .item select:first-child { grid-column: 1 / -1; } .item.nob { grid-template-columns: 1fr 1fr 38px; } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick { position: relative; width: 92px; height: 92px; flex: none; }
  .pick img { width: 100%; height: 100%; border-radius: 14px; object-fit: cover; }
  .pick .x { position: absolute; top: -6px; right: -6px; width: 28px; height: 28px; border-radius: 50%; background: var(--red); color: #fff; font-size: 15px; }
  .flist { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .fitem { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 14px; background: rgba(255,255,255,.62); border: 1px solid var(--line); font-size: 14px; }
  .fitem .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fitem small { flex: none; color: var(--sub); font-size: 12px; }
  .fitem .x { flex: none; width: 28px; height: 28px; border-radius: 50%; font-size: 15px; }
  .files { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .fdl { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px solid var(--line); background: rgba(255,255,255,.6); border-radius: 14px; padding: 10px 12px; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; }
  .fdl:hover { background: rgba(255,255,255,.9); }
  .fdl span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
  .fdl small { flex: none; color: var(--sub); font-size: 12px; pointer-events: none; }
  .fdl i { font-style: normal; pointer-events: none; }
  .addph { width: 92px; height: 92px; border-radius: 14px; border: 1.5px dashed rgba(90,98,130,.5); display: grid; place-items: center; color: var(--sub); font-size: 14px; cursor: pointer; flex: none; text-align: center; background: rgba(255,255,255,.5); }
  .primary { width: 100%; height: 54px; border: 0; border-radius: 16px; background: var(--navy); color: #fff; font: inherit; font-size: 17px; margin-top: 18px; cursor: pointer; }
  .primary:disabled { opacity: .55; }
  details.paste { margin-bottom: 8px; padding: 10px 14px; border-radius: 16px; background: rgba(255,255,255,.55); border: 1px solid var(--line); }
  details.paste summary { cursor: pointer; font-size: 14.5px; color: var(--sub); }
  .toast { position: fixed; z-index: 30; left: 50%; bottom: 96px; transform: translateX(-50%); background: rgba(28,35,64,.92); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; text-align: center; }
  .toast.on { opacity: 1; }
  .viewer { position: fixed; inset: 0; z-index: 20; background: rgba(15,18,35,.9); display: none; place-items: center; }
  .viewer.on { display: grid; }
  .viewer img { max-width: 96vw; max-height: 92vh; border-radius: 12px; }
  .hide { display: none !important; }

  /* ---------- PC 위젯 (넓은 화면에서만 양옆에 표시) ---------- */
  .side { display: none; }
  @media (min-width: 1300px) {
    .side {
      --sw: min(300px, calc((100vw - 760px) / 2 - 48px));
      --u: max(128px, calc((var(--sw) - 12px) / 2));
      display: flex; flex-direction: column; gap: 10px; position: fixed; top: 16px; z-index: 3;
      width: var(--sw); max-height: calc(100vh - 32px); overflow-y: auto; scrollbar-width: none; padding: 4px;
      margin: -4px;
    }
    .side::-webkit-scrollbar { display: none; }
    .side-l { left: calc((100vw - 760px) / 2 - var(--sw) - 20px); }
    .side-r { right: calc((100vw - 760px) / 2 - var(--sw) - 20px); }
  }
  /* 위젯 그리드: 가로 2칸, 칸 크기 = 위젯 1×1 */
  .wgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: var(--u); grid-auto-flow: row dense; gap: 12px; min-height: var(--u); border-radius: var(--radius); }
  .wgrid.over { outline: 2px dashed rgba(63,111,224,.55); outline-offset: 3px; }
  .w { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 8px 12px 12px; }
  .w[data-size="1x1"] { grid-column: span 1; grid-row: span 1; }
  .w[data-size="1x2"] { grid-column: span 1; grid-row: span 2; }
  .w[data-size="2x1"] { grid-column: span 2; grid-row: span 1; }
  .w[data-size="2x2"] { grid-column: span 2; grid-row: span 2; }
  .w[data-size="2x3"] { grid-column: span 2; grid-row: span 3; }
  .w-h { flex: none; display: flex; align-items: center; gap: 4px; height: 30px; margin-bottom: 4px; cursor: grab; user-select: none; -webkit-user-select: none; }
  .w-h:active { cursor: grabbing; }
  .w-g { flex: none; width: 14px; color: rgba(90,98,130,.55); font-size: 13px; letter-spacing: -2px; }
  .w-t { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .w-btn { flex: none; border: 0; height: 26px; min-width: 26px; padding: 0 7px; border-radius: 9px; background: rgba(255,255,255,.62); font: inherit; font-size: 12px; color: var(--sub); cursor: pointer; }
  .w-btn:hover { background: rgba(255,255,255,.9); color: var(--ink); }
  .w-sz { font-variant-numeric: tabular-nums; }
  .w-b { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  .w-b::-webkit-scrollbar { display: none; }
  .w.dragging { opacity: .35; }
  .w-ghost { position: fixed; z-index: 60; margin: 0; pointer-events: none; opacity: .94; transform: rotate(1.2deg) scale(1.02); box-shadow: 0 24px 60px rgba(40,50,110,.28); }
  body.wdragging, body.wdragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
  .w.ins-top { box-shadow: 0 -4px 0 0 var(--blue), 0 10px 30px rgba(40,50,110,.10); }
  .w.ins-bot { box-shadow: 0 4px 0 0 var(--blue), 0 10px 30px rgba(40,50,110,.10); }
  .w.ins-left { box-shadow: -4px 0 0 0 var(--blue), 0 10px 30px rgba(40,50,110,.10); }
  .w.ins-right { box-shadow: 4px 0 0 0 var(--blue), 0 10px 30px rgba(40,50,110,.10); }
  .w-reset { flex: none; align-self: center; border: 0; background: transparent; font: inherit; font-size: 12px; color: var(--sub); opacity: .7; cursor: pointer; padding: 4px 10px; border-radius: 999px; }
  .w-reset:hover { opacity: 1; background: rgba(255,255,255,.5); }
  /* 작은 크기에서는 덜 중요한 내용을 숨깁니다 */
  .w[data-w="cal"][data-size="2x2"] .cal-d { min-height: 0; padding: 1px 0; gap: 1px; }
  .w[data-w="cal"][data-size="2x2"] .cal-d span { width: 22px; height: 22px; }
  .w[data-w="cal"][data-size="2x2"] .cal-w { padding: 2px 0; }
  .w[data-w="cal"][data-size="2x2"] .cal-legend { margin-top: 6px; }
  .w[data-w="wx"] .wx-form { display: none; }
  .w[data-w="wx"].edit .wx-form { display: flex; }
  .w[data-w="wx"][data-size="2x1"] .wx-days, .w[data-w="wx"][data-size="1x1"] .wx-days,
  .w[data-w="wx"][data-size="1x1"] .wx-meta, .w[data-w="wx"][data-size="1x1"] .wx-desc { display: none; }
  .w[data-w="wx"][data-size="1x1"] .wx-now { flex-direction: column; align-items: flex-start; gap: 4px; }
  .w[data-w="wx"][data-size="1x1"] .wx-ic { font-size: 26px; }
  .w[data-w="wx"][data-size="1x1"] .wx-t { font-size: 24px; }
  .w[data-w="wx"][data-size="1x1"] .wx-place { font-size: 13px; }
  .w[data-w="bible"][data-size="1x1"] .bv { font-size: 13px; line-height: 1.6; }
  .w[data-w="bible"][data-size="1x1"] .bref { font-size: 12px; }
  /* 빠른메모 */
  .memo-tx { display: block; width: 100%; height: 100%; min-height: 0; resize: none; padding: 10px 12px; font-size: 14px; line-height: 1.6; border-radius: 14px; background: rgba(255,255,255,.55); }
  .w-note { font-size: 11px; font-weight: 400; color: var(--green); opacity: 0; transition: opacity .3s; margin-left: 4px; }
  .w-note.on { opacity: 1; }
  /* 계산기 */
  .calc { height: 100%; display: flex; flex-direction: column; gap: 7px; outline: none; }
  .calc-d { flex: none; padding: 5px 10px; border-radius: 12px; background: rgba(255,255,255,.62); text-align: right; overflow: hidden; }
  .calc-e { height: 16px; font-size: 11.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .calc-v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .calc-k { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 5px; }
  .calc-k button { min-height: 0; border: 0; border-radius: 10px; background: rgba(255,255,255,.72); font: inherit; font-size: 15px; color: var(--ink); cursor: pointer; padding: 0; }
  .calc-k button:hover { background: rgba(255,255,255,.95); }
  .calc-k button:active { transform: scale(.96); }
  .calc-k .op { background: rgba(35,44,99,.09); color: var(--navy); font-weight: 600; }
  .calc-k .fn { color: var(--sub); }
  .calc-k .eq { background: var(--navy); color: #fff; font-weight: 600; }
  .calc-k .eq:hover { background: #2f3a7d; }
  .w[data-w="calc"][data-size="1x2"] .calc-v { font-size: 19px; }
  .w[data-w="calc"][data-size="1x2"] .calc-k button { font-size: 13px; border-radius: 8px; }
  /* 실시간 환율 */
  .fx-v { font-size: 27px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .fx-v small { margin-left: 2px; font-size: 14px; font-weight: 600; color: var(--sub); }
  .fx-c { margin-top: 2px; font-size: 12.5px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .fx-c.up { color: var(--red); } .fx-c.down { color: var(--blue); }
  .fx-cv { margin-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .fx-cv input { width: 92px; flex: none; padding: 6px 9px; font-size: 13.5px; border-radius: 10px; text-align: right; }
  .fx-cv b { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .fx-src { margin-top: 8px; font-size: 11.5px; color: var(--sub); }
  .w[data-w="fx"][data-size="2x1"] .fx-src { display: none; }
  .w[data-w="fx"][data-size="1x1"] .fx-cv, .w[data-w="fx"][data-size="1x1"] .fx-src { display: none; }
  .w[data-w="fx"][data-size="1x1"] .fx-v { font-size: 21px; }
  .w[data-w="fx"][data-size="1x1"] .fx-c { font-size: 11.5px; }
  .wcard { padding: 16px; }
  .wcard h4 { margin: 0 0 10px; font-size: 13.5px; font-weight: 600; color: var(--sub); }
  /* 캘린더 */
  .cal-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-h b { font-size: 16px; font-weight: 700; }
  .cal-h button { border: 0; width: 30px; height: 30px; border-radius: 10px; background: rgba(255,255,255,.65); color: var(--ink); font: inherit; font-size: 16px; cursor: pointer; }
  .cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-w { padding: 4px 0; text-align: center; font-size: 11.5px; color: var(--sub); }
  .cal-w.sun { color: var(--red); } .cal-w.sat { color: var(--blue); }
  .cal-d { min-height: 40px; padding: 3px 0; border: 0; border-radius: 10px; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; font-size: 13px; color: var(--ink); cursor: default; }
  .cal-d span { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 999px; }
  .cal-d.has { cursor: pointer; }
  .cal-d.has:hover { background: rgba(255,255,255,.75); }
  .cal-d.today span { background: var(--navy); color: #fff; }
  .cal-d.sel { background: rgba(35,44,99,.12); }
  .cal-d em { height: 6px; display: flex; gap: 3px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .d-시공일정 { background: #3f6fe0; } .d-보수일정 { background: #1f9d78; } .d-화성본드 { background: #f08a24; }
  .cal-legend { margin-top: 10px; display: flex; justify-content: center; gap: 12px; font-size: 12px; color: var(--sub); }
  .cal-legend span { display: flex; align-items: center; gap: 5px; }
  /* 날씨 */
  .wx-form { display: flex; gap: 6px; margin-bottom: 12px; }
  .wx-form input { padding: 8px 10px; font-size: 14px; border-radius: 12px; }
  .wx-form button { flex: none; }
  .wx-now { display: flex; align-items: center; gap: 12px; }
  .wx-ic { font-size: 40px; line-height: 1; }
  .wx-t { font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .wx-place { font-size: 15px; font-weight: 600; }
  .wx-desc { font-size: 13px; color: var(--sub); }
  .wx-meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--sub); }
  .wx-days { margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .wx-day { padding: 6px 2px; border-radius: 12px; background: rgba(255,255,255,.5); text-align: center; font-size: 12px; }
  .wx-day b { display: block; margin: 2px 0; font-size: 18px; font-weight: 400; }
  .wx-msg { padding: 6px 0; font-size: 13px; color: var(--sub); }
  .wx-msg a { color: var(--blue); }
  /* 성경말씀 */
  .bv { margin: 0; font-size: 15px; line-height: 1.75; word-break: keep-all; }
  .bref { margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--navy); }
  .blink { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--blue); text-decoration: none; }
  /* 뷰어 권한: 글쓰기 · 수정 · 삭제 버튼을 숨깁니다 */
  body.role-viewer .fab, body.role-viewer [data-a="edit"], body.role-viewer [data-a="del"], body.role-viewer [data-a="copy"] { display: none !important; }
  /* 댓글 */
  .clist { margin-top: 12px; padding-top: 4px; border-top: 1px solid rgba(120,130,180,.2); }
  .cmt { padding: 9px 0; }
  .cmt + .cmt { border-top: 1px dashed rgba(120,130,180,.2); }
  .cmt-h { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); }
  .cmt-h b { color: var(--ink); font-weight: 600; }
  .cmt-h button { margin-left: auto; border: 0; background: none; color: var(--red); font: inherit; font-size: 12.5px; cursor: pointer; padding: 2px 4px; }
  .cmt-t { margin-top: 3px; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .cmt .thumbs { margin-top: 8px; }
  .cmt .thumbs img { width: 76px; height: 76px; }
  .cbox { margin-top: 12px; }
  .cbox textarea { min-height: 70px; }
  .cpicks { margin-top: 6px; padding-top: 6px; }
  .cpicks:empty { display: none; }
  .cbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .mini.prim { background: var(--navy); border-color: var(--navy); color: #fff; }
  .mini:disabled { opacity: .55; }

  /* ---------- 랜딩(접속) 화면 ---------- */
  .gate {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; overflow: hidden;
    background:
      radial-gradient(60vmax 60vmax at 8% 0%, #c9d6ff 0%, transparent 60%),
      radial-gradient(55vmax 55vmax at 100% 20%, #ffe3c2 0%, transparent 60%),
      radial-gradient(60vmax 60vmax at 40% 100%, #c8f1e4 0%, transparent 60%),
      #eef1fb;
    transition: opacity .45s ease, visibility .45s ease;
  }
  .gate.off { opacity: 0; visibility: hidden; }
  .gate-in { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; }
  .drop { width: min(46vw, 190px); aspect-ratio: 1; transform: translateY(-120vh); animation: drop 1.8s linear .25s forwards; }
  .gate-logo { width: 100%; height: 100%; display: block; border-radius: 50%; transform-origin: 50% 100%; filter: drop-shadow(0 14px 22px rgba(10,23,78,.28)); animation: squash 1.8s linear .25s both; }
  .gate-shadow { width: 120px; height: 12px; margin-top: 10px; border-radius: 50%; background: rgba(10,23,78,.2); filter: blur(4px); opacity: 0; transform: scale(.3); animation: shade 1.8s linear .25s forwards; }
  /* 떨어진 뒤 두 번 튀고 멈춥니다 */
  @keyframes drop {
    0% { transform: translateY(-120vh); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
    42% { transform: translateY(0); animation-timing-function: cubic-bezier(0, .55, .45, 1); }
    60% { transform: translateY(-62%); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
    76% { transform: translateY(0); animation-timing-function: cubic-bezier(0, .55, .45, 1); }
    88% { transform: translateY(-24%); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
    100% { transform: translateY(0); }
  }
  @keyframes squash {
    0%, 40% { transform: scale(1, 1); }
    43% { transform: scale(1.14, .84); }
    52% { transform: scale(1, 1); }
    74% { transform: scale(1, 1); }
    77% { transform: scale(1.08, .9); }
    84%, 100% { transform: scale(1, 1); }
  }
  @keyframes shade {
    0% { opacity: 0; transform: scale(.3); }
    42% { opacity: 1; transform: scale(1); }
    60% { opacity: .35; transform: scale(.55); }
    76% { opacity: 1; transform: scale(1); }
    88% { opacity: .6; transform: scale(.75); }
    100% { opacity: 1; transform: scale(1); }
  }
  .gate-card { width: 100%; margin-top: 22px; padding: 20px; text-align: center; opacity: 0; transform: translateY(12px); animation: rise .5s ease 2.15s forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .gate-card h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .gate-card p { margin: 4px 0 14px; font-size: 14px; color: var(--sub); }
  #gateCode { text-align: center; font-size: 20px; letter-spacing: 6px; -webkit-text-security: disc; }
  #gateCode.shake { animation: shake .4s; border-color: var(--red); }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  .gate-msg { min-height: 20px; margin-top: 8px; font-size: 13.5px; color: var(--red); }
  @media (prefers-reduced-motion: reduce) {
    .drop, .gate-logo, .gate-shadow, .gate-card { animation-duration: .01s; animation-delay: 0s; }
  }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-in">
    <div class="drop"><img class="gate-logo" src="icon-512.png" alt="헤븐인 로고"></div>
    <div class="gate-shadow"></div>
    <form class="gate-card glass" id="gateForm" autocomplete="off">
      <h2>헤븐인 업무일정</h2>
      <p>접속코드를 입력해 주세요</p>
      <input id="gateCode" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="접속코드" aria-label="접속코드">
      <button class="primary" id="gateBtn" type="submit">들어가기</button>
      <div class="gate-msg" id="gateMsg"></div>
    </form>
  </div>
</div>
<div class="wrap">
  <header class="top glass">
    <img class="logo" src="icon-512.png" alt="" style="border-radius:50%">
    <div><h1>헤븐인 업무일정</h1><p id="sub">불러오는 중…</p></div>
    <button class="icon-btn" id="btnReload">새로고침</button>
  </header>

  <nav class="tabs glass" id="tabs">
    <button class="tab on" data-t="전체">전체</button>
    <button class="tab" data-t="시공일정">시공일정</button>
    <button class="tab" data-t="보수일정">보수일정</button>
    <button class="tab" data-t="화성본드">화성본드</button>
  </nav>
  <div class="tools">
    <input id="q" type="search" placeholder="현장명, 업체명, 주소, 인원 검색">
    <button class="chip" id="upc">다가오는 일정</button>
    <button class="chip on hide" id="dayChip"></button>
  </div>
  <main id="list"></main>
</div>

<aside class="side side-l">
  <div class="wgrid" id="wl">
    <section class="w glass" data-w="cal" data-size="2x2">
      <div class="w-h"><span class="w-g">⠿</span><b class="w-t" id="calTitle"></b><button class="w-btn" id="calPrev" aria-label="이전 달">‹</button><button class="w-btn" id="calNext" aria-label="다음 달">›</button><button class="w-btn w-sz" title="크기 바꾸기"></button></div>
      <div class="w-b">
        <div class="cal-g" id="calGrid"></div>
        <div class="cal-legend"><span><i class="dot d-시공일정"></i>시공</span><span><i class="dot d-보수일정"></i>보수</span><span><i class="dot d-화성본드"></i>화성본드</span></div>
      </div>
    </section>
    <section class="w glass" data-w="calc" data-size="2x2">
      <div class="w-h"><span class="w-g">⠿</span><b class="w-t">계산기</b><button class="w-btn w-sz" title="크기 바꾸기"></button></div>
      <div class="w-b">
        <div class="calc" id="calc" tabindex="0">
          <div class="calc-d"><div class="calc-e" id="calcE"></div><div class="calc-v" id="calcV">0</div></div>
          <div class="calc-k" id="calcK">
            <button class="fn" data-k="C">C</button><button class="fn" data-k="B">⌫</button><button class="fn" data-k="%">%</button><button class="op" data-k="/">÷</button>
            <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="*">×</button>
            <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button>
            <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
            <button class="fn" data-k="N">±</button><button data-k="0">0</button><button data-k=".">.</button><button class="eq" data-k="=">=</button>
          </div>
        </div>
      </div>
    </section>
    <section class="w glass" data-w="memo" data-size="2x1">
      <div class="w-h"><span class="w-g">⠿</span><b class="w-t">빠른메모<span class="w-note" id="memoNote">저장됨</span></b><button class="w-btn w-sz" title="크기 바꾸기"></button></div>
      <div class="w-b"><textarea class="memo-tx" id="memoTx" placeholder="떠오르는 내용을 바로 적어 두세요. 자동으로 저장됩니다."></textarea></div>
    </section>
  </div>
</aside>
<aside class="side side-r">
  <div class="wgrid" id="wr">
    <section class="w glass" data-w="wx" data-size="2x2">
      <div class="w-h"><span class="w-g">⠿</span><b class="w-t">날씨</b><button class="w-btn" id="wxEdit" title="지역 바꾸기">📍</button><button class="w-btn w-sz" title="크기 바꾸기"></button></div>
      <div class="w-b">
        <form class="wx-form" id="wxForm"><input id="wxCity" placeholder="도시명 (예: 서울)" autocomplete="off"><button class="mini" type="submit">보기</button></form>
        <div id="wxBody"><div class="wx-msg">불러오는 중…</div></div>
      </div>
    </section>
    <section class="w glass" data-w="fx" data-size="2x1">
      <div class="w-h"><span class="w-g">⠿</span><b class="w-t">실시간 환율 · 1달러</b><button class="w-btn" id="fxRe" title="새로고침">↻</button><button class="w-btn w-sz" title="크기 바꾸기"></button></div>
      <div class="w-b">
        <div class="fx-v" id="fxVal">–<small>원</small></div>
        <div class="fx-c" id="fxChg">불러오는 중…</div>
        <div class="fx-cv"><input id="fxUsd" inputmode="decimal" placeholder="달러" autocomplete="off"><span>$ =</span><b id="fxKrw">0원</b></div>
        <div class="fx-src" id="fxSrc"></div>
      </div>
    </section>
    <section class="w glass" data-w="bible" data-size="2x2">
      <div class="w-h"><span class="w-g">⠿</span><b class="w-t">오늘의 말씀 · 매일성경묵상</b><button class="w-btn w-sz" title="크기 바꾸기"></button></div>
      <div class="w-b"><div id="bibleBody"><div class="wx-msg">로그인하면 오늘의 말씀이 표시됩니다.</div></div></div>
    </section>
  </div>
  <button class="w-reset" id="wReset" title="위젯 위치와 크기를 처음 상태로 되돌립니다">위젯 배치 초기화</button>
</aside>

<button class="fab" id="fab"><b>＋</b>글쓰기</button>

<div class="sheet-bg" id="bg">
  <section class="sheet glass">
    <h3><span id="ftitle">새 글 쓰기</span><button class="mini" id="btnClose">닫기</button></h3>
    <div class="seg" id="seg">
      <button class="chip on" data-t="시공일정">시공일정</button>
      <button class="chip" data-t="보수일정">보수일정</button>
      <button class="chip" data-t="화성본드">화성본드</button>
    </div>

    <details class="paste" id="pasteBox">
      <summary>밴드 형식 글 붙여넣기 (자동으로 칸 채우기)</summary>
      <textarea id="pasteTxt" placeholder="#시공일정 2026년 11월 12일 (목)&#10;담당자 : …&#10;업체명 : …" style="margin-top:8px"></textarea>
      <button class="mini" id="btnParse" style="margin-top:6px">칸 채우기</button>
    </details>

    <div class="row2">
      <div><label class="f">일자 *</label><input type="date" id="fDate"></div>
      <div class="only-total"><label class="f">종료일 (여러 날일 때)</label><input type="date" id="fEnd"></div>
    </div>
    <div class="row2 only-total">
      <div><label class="f">거래처</label><input id="fClient" data-sug="clients" autocomplete="off" placeholder="예: 유앤어스"></div>
      <div><label class="f">담당자</label><input id="fManager" placeholder="예: 노태훈 차장"></div>
    </div>
    <div class="only-total"><label class="f">업체명</label><input id="fCompany"></div>
    <label class="f">현장명</label><input id="fSite">
    <div class="only-total"><label class="f">주소</label><input id="fAddr"></div>

    <label class="f" id="lblItems">내용 (내역 · 단위 · 수량 · 단가)</label>
    <div id="items"></div>
    <button class="mini" id="btnAddItem">＋ 내역 추가</button>

    <div class="only-total">
      <label class="f">소장 (이름 · 연락처)</label><input id="fChief">
      <label class="f">인원</label>
      <div class="chips" id="workers"></div>
      <input id="fWorkerEtc" placeholder="목록에 없는 인원 (쉼표로 구분)" style="margin-top:8px">
    </div>

      <input type="file" id="attach" multiple class="hide">

    <button class="primary" id="btnSave">등록하기</button>
  </section>
</div>

<datalist id="dlClient"></datalist><datalist id="dlWorker"></datalist><datalist id="dlUnit"></datalist>
<div class="viewer" id="viewer"><img id="viewImg" alt="사진"></div>
<div class="toast" id="toast"></div>
<div class="sug" id="sug"></div>

<script>
var S = { code: '', cfg: { workers: [], clients: [], units: [] }, entries: [], tab: '전체', q: '', upc: false, imgs: {} };
var F = { id: '', type: '시공일정', keep: [], news: [], picked: {}, fkeep: [], fnews: [] };
var $ = function (id) { return document.getElementById(id); };
var WD = ['일', '월', '화', '수', '목', '금', '토'];

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function rich(s) { return esc(s).replace(/(01[016789][- ]?\d{3,4}[- ]?\d{4})/g, function (m) { return '<a href="tel:' + m.replace(/[^\d]/g, '') + '" target="_top">' + m + '</a>'; }); }
function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove('on'); }, 2600); }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function nice(d) { if (!/^\d{4}-\d{2}-\d{2}/.test(d)) return d; var x = new Date(d.slice(0, 10) + 'T00:00:00'); return x.getFullYear() + '년 ' + (x.getMonth() + 1) + '월 ' + x.getDate() + '일 (' + WD[x.getDay()] + ')'; }
var API = 'https://script.google.com/macros/s/AKfycbyi7qyGBloWlyzilhxT63JSwaMWUuLksYX4km49evavfQyUwipPIyp7XZw1uhlkQKvF1A/exec';
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, code: S.code, args: args })
  }).then(function (r) {
    if (!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')');
    return r.json();
  }).then(function (j) {
    if (!j.ok) throw new Error(j.error || '알 수 없는 오류');
    return j.data;
  }).catch(function (e) {
    if (e && e.name === 'TypeError') throw new Error('인터넷 연결을 확인해 주세요');
    throw e;
  });
}

/* ---------- 불러오기 ---------- */
function load(cb) {
  cb = typeof cb === 'function' ? cb : null;
  $('sub').textContent = '불러오는 중…';
  call('getInit').then(function (r) {
    S.cfg = r.config; S.entries = r.entries;
    S.user = r.user || null;
    loadBible(); applyLayout();
    document.body.classList.toggle('role-viewer', !!(S.user && S.user.role !== 'editor'));
    $('dlClient').innerHTML = S.cfg.clients.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
    $('dlWorker').innerHTML = S.cfg.workers.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
    $('dlUnit').innerHTML = S.cfg.units.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
    render();
    if (cb) cb(true);
  }).catch(function (e) {
    var msg = String(e && e.message || e);
    if (msg.indexOf('AUTH') >= 0) { if (cb) cb(false, '접속코드가 맞지 않습니다'); else lock(); return; }
    $('sub').textContent = '불러오지 못했습니다';
    if (cb) cb(false, msg); else toast('오류: ' + msg);
  });
}

// 계산기: 사칙연산 · 퍼센트 · 부호 바꾸기 (키보드 입력도 됩니다)
var CALC = { cur: '0', prev: null, op: null, fresh: false, expr: '' };
var OPS = { '+': '+', '-': '−', '*': '×', '/': '÷' };

function cFix(n) { return isFinite(n) ? parseFloat(n.toPrecision(12)) : NaN; }
function cFmt(s) {

  if (s === 'NaN') return '오류';
  if (/e/.test(s)) return s;
  var neg = s.charAt(0) === '-', p = (neg ? s.slice(1) : s).split('.');
  return (neg ? '-' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (p.length > 1 ? '.' + p[1] : '');
}
function cCalc(a, op, b) {
  if (op === '+') return cFix(a + b);
  if (op === '-') return cFix(a - b);
  if (op === '*') return cFix(a * b);
  return b === 0 ? NaN : cFix(a / b);
}
function calcKey(k) {
  var C = CALC;
  if (C.cur === 'NaN' && k !== 'C') { C.cur = '0'; C.prev = null; C.op = null; C.expr = ''; }
  if (/^\d$/.test(k)) {
    if (C.fresh || C.cur === '0') C.cur = k; else if (C.cur.replace(/[-.]/g, '').length < 15) C.cur += k;
    C.fresh = false;
  } else if (k === '.') {
    if (C.fresh) { C.cur = '0.'; C.fresh = false; } else if (C.cur.indexOf('.') < 0) C.cur += '.';
  } else if (OPS[k]) {
    if (C.op && !C.fresh) C.cur = String(cCalc(C.prev, C.op, cNum(C.cur)));
    C.prev = cNum(C.cur); C.op = k; C.fresh = true; C.expr = cFmt(C.prev) + ' ' + OPS[k];
    if (C.cur === 'NaN') { C.prev = null; C.op = null; C.expr = ''; }
  } else if (k === '=') {
    if (C.op) {
      var b = cNum(C.cur);
      C.expr = cFmt(C.prev) + ' ' + OPS[C.op] + ' ' + cFmt(b) + ' =';
      C.cur = String(cCalc(C.prev, C.op, b)); C.prev = null; C.op = null; C.fresh = true;
    }
  } else if (k === 'C') {
    C.cur = '0'; C.prev = null; C.op = null; C.fresh = false; C.expr = '';
  } else if (k === 'B') {
    if (!C.fresh) { C.cur = C.cur.slice(0, -1); if (C.cur === '' || C.cur === '-') C.cur = '0'; }
  } else if (k === 'N') {
    if (C.cur !== '0') C.cur = C.cur.charAt(0) === '-' ? C.cur.slice(1) : '-' + C.cur;
  } else if (k === '%') {
    var v = cNum(C.cur);
    C.cur = String(C.prev != null && (C.op === '+' || C.op === '-') ? cFix(C.prev * v / 100) : cFix(v / 100)); C.fresh = false;
  }
  $('calcE').textContent = C.expr;
  $('calcV').textContent = cFmt(C.cur);
}
$('calcK').onclick = function (ev) { var b = ev.target.closest('button[data-k]'); if (b) calcKey(b.dataset.k); };

// 실시간 환율(달러→원): Coinbase 실시간 시세, 안 되면 서버에서 받아 옵니다. 1분마다 갱신.
var FX = { rate: null, base: null, baseDay: '' };
function fxMoney(n) { return Math.round(n).toLocaleString('ko-KR'); }
function fxConv() {
  var u = parseFloat(String($('fxUsd').value).replace(/[^\d.]/g, ''));
  $('fxKrw').textContent = FX.rate && u ? fxMoney(u * FX.rate) + '원' : '0원';
}
function fxBase() {
  if (FX.baseDay === today()) return;
  FX.baseDay = today();
  fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.usd && j.usd.krw && j.date < today()) { FX.base = j.usd.krw; if (FX.rate) drawFx(FX.last); } })
    .catch(function () { FX.baseDay = ''; });
}
function drawFx(d) {
  FX.last = d; FX.rate = d.rate;
  $('fxVal').innerHTML = d.rate.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '<small>원</small>';
  var ch = d.change != null ? d.change : (FX.base ? d.rate - FX.base : null), el = $('fxChg');
  if (ch == null) { el.className = 'fx-c'; el.textContent = d.live ? '실시간' : '일일 기준 환율'; }
  else {
    var pct = ch / (d.rate - ch) * 100;
    el.className = 'fx-c' + (ch > 0.005 ? ' up' : ch < -0.005 ? ' down' : '');
    el.textContent = (ch > 0.005 ? '▲ ' : ch < -0.005 ? '▼ ' : '– ') + Math.abs(ch).toFixed(2) + ' (' + (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%) 전일 대비';
  }
  var tm = new Date();
  $('fxSrc').textContent = d.source + ' · ' + ('0' + tm.getHours()).slice(-2) + ':' + ('0' + tm.getMinutes()).slice(-2) + ' 기준' + (d.live ? ' · 1분마다 갱신' : '');
  fxConv();
}
function loadFx() {
  if (!sideMQ.matches || document.hidden) return;
  fxBase();
  fetch('https://api.coinbase.com/v2/exchange-rates?currency=USD', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var r = parseFloat(j && j.data && j.data.rates && j.data.rates.KRW);
      if (!r) throw new Error('NF');
      drawFx({ rate: r, change: null, source: 'Coinbase', live: true });
    })
    .catch(function () {
      if (!S.code) { if (!FX.rate) $('fxChg').textContent = '환율을 불러오지 못했습니다.'; return; }
      call('getFx').then(function (d) { drawFx(d); }).catch(function () { if (!FX.rate) $('fxChg').textContent = '환율을 불러오지 못했습니다.'; });
    });
}
$('fxUsd').oninput = fxConv;

var WDEF = { cal: ['2x2', '2x3'], calc: ['2x2', '1x2'], memo: ['2x1', '2x2', '1x1', '1x2'], wx: ['2x2', '2x1', '1x1'], fx: ['2x1', '2x2', '1x1'], bible: ['2x2', '2x1', '1x1'] };

  if (!o || !o.l || !o.r) o = { l: WHOME.l, r: WHOME.r, s: {} };
  var seen = {};
  ['l', 'r'].forEach(function (k) { o[k].forEach(function (id) { var w = wEl(id); if (w && !seen[id]) { WG[k].appendChild(w); seen[id] = 1; } }); });
  ['l', 'r'].forEach(function (k) { WHOME[k].forEach(function (id) { if (!seen[id]) WG[k].appendChild(wEl(id)); }); });
  document.querySelectorAll('.w').forEach(function (w) { wSize(w, (o.s || {})[w.dataset.w]); });

function wClear() {

  WG.l.classList.remove('over'); WG.r.classList.remove('over');
}
function wSpot(t, x, y) {
  var r = t.getBoundingClientRect(), g = t.parentNode.getBoundingClientRect();
  var horiz = r.width < g.width * 0.75;
  var before = horiz ? x < r.left + r.width / 2 : y < r.top + r.height / 2;
  return { before: before, cls: horiz ? (before ? 'ins-left' : 'ins-right') : (before ? 'ins-top' : 'ins-bot') };
}
document.querySelectorAll('.w').forEach(function (w) {
  w.querySelector('.w-h').addEventListener('pointerdown', function (ev) {

    var r = w.getBoundingClientRect();
    WDRAG = { w: w, x0: ev.clientX, y0: ev.clientY, dx: ev.clientX - r.left, dy: ev.clientY - r.top, on: false, to: null };
    ev.preventDefault();
  });
  w.querySelector('.w-sz').addEventListener('click', function () {

document.addEventListener('pointermove', function (ev) {
  var d = WDRAG;
  if (!d) return;
  if (!d.on) {
    if (Math.abs(ev.clientX - d.x0) + Math.abs(ev.clientY - d.y0) < 6) return;
    var r = d.w.getBoundingClientRect();
    d.on = true;
    d.ghost = d.w.cloneNode(true);
    d.ghost.querySelectorAll('[id]').forEach(function (x) { x.removeAttribute('id'); });
    d.ghost.classList.add('w-ghost');
    d.ghost.style.width = r.width + 'px'; d.ghost.style.height = r.height + 'px';
    document.body.appendChild(d.ghost);
    d.w.classList.add('dragging'); document.body.classList.add('wdragging');
  }
  d.ghost.style.left = (ev.clientX - d.dx) + 'px'; d.ghost.style.top = (ev.clientY - d.dy) + 'px';
  wClear(); d.to = null;
  var el = document.elementFromPoint(ev.clientX, ev.clientY), side = el && el.closest('.side');
  if (!side) return;
  var g = side.querySelector('.wgrid'), t = el.closest('.wgrid > .w');
  if (t && t !== d.w) { var s = wSpot(t, ev.clientX, ev.clientY); t.classList.add(s.cls); d.to = { g: g, t: t, before: s.before }; }
  else if (!t) { g.classList.add('over'); d.to = { g: g }; }
});
function wEnd(ok) {
  var d = WDRAG;
  WDRAG = null;
  if (!d) return;
  if (d.on) {
    if (ok && d.to) {
      if (d.to.t) d.to.g.insertBefore(d.w, d.to.before ? d.to.t : d.to.t.nextSibling); else d.to.g.appendChild(d.w);

    d.ghost.remove(); d.w.classList.remove('dragging'); document.body.classList.remove('wdragging');
  }

}
document.addEventListener('pointerup', function () { wEnd(true); });
document.addEventListener('pointercancel', function () { wEnd(false); });
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && WDRAG) wEnd(false); });

function shareText(e) {

  if (e.kind === 'total') {
    L.push('담당자 : ' + [e.client, e.manager].filter(String).join(' '), '업체명 : ' + e.company, '현장명 : ' + e.site, '주소 : ' + e.address,
      '내용 : ' + e.items.map(itemText).join(', '), '소장 : ' + e.chief, '인원 : ' + e.workers);
    if (e.note) L.push('기타 :\n' + e.note);

  call('getFile', b.dataset.fid).then(function (r) {

    document.body.appendChild(a); a.click(); a.remove();

    .then(function () { b.disabled = false; small.textContent = was; });

      return new Promise(function (res) {
        var rd = new FileReader();
        rd.onload = function () { F.fnews.push({ name: file.name, mime: file.type || 'application/octet-stream', size: file.size, data: String(rd.result).split(',')[1] || '' }); drawFiles(); res(); };
        rd.onerror = function () { toast('열 수 없는 파일이 있습니다: ' + file.name); res(); };
        rd.readAsDataURL(file);
      });
    });
  }, Promise.resolve());
};

function openForm(e) {
  if (S.user && S.user.role !== 'editor') { toast('보기 권한만 있어 글을 쓰거나 고칠 수 없습니다'); return; }
  F.id = e ? e.id : ''; F.keep = e ? e.photos.slice() : []; F.news = [];
  F.fkeep = e && e.files ? e.files.slice() : []; F.fnews = []; drawFiles();
  $('ftitle').textContent = e ? '글 수정' : '새 글 쓰기';
  $('btnSave').textContent = e ? '수정 저장' : '등록하기';
  $('seg').classList.toggle('hide', !!e);
  $('fDate').value = e ? e.date : today(); $('fEnd').value = e ? (e.endDate || '') : '';
  $('fClient').value = e ? (e.client || '') : ''; $('fManager').value = e ? (e.manager || '') : '';
  $('fCompany').value = e ? (e.company || '') : ''; $('fSite').value = e ? (e.site || '') : '';
  $('fAddr').value = e ? (e.address || '') : ''; $('fChief').value = e ? (e.chief || '') : '';
  $('fNote').value = e ? (e.note || '') : ''; $('pasteTxt').value = '';
  $('fAuthor').value = e ? (e.author || '') : (S.user ? S.user.name : store('hia_author'));
  var ws = e && e.workers ? e.workers.split(/\s*,\s*/).filter(String) : [];
  drawWorkers(ws.filter(function (w) { return S.cfg.workers.indexOf(w) >= 0; }));
  $('fWorkerEtc').value = ws.filter(function (w) { return S.cfg.workers.indexOf(w) < 0; }).join(', ');
  $('items').innerHTML = ''; (e && e.items.length ? e.items : [{}]).forEach(function (i) { F.type = e ? e.type : F.type; addItem(i); });
  setType(e ? e.type : (S.tab !== '전체' ? S.tab : '시공일정'));
  drawPicks(); $('bg').classList.add('on');
}
$('fab').onclick = function () { openForm(null); };
$('btnClose').onclick = function () { $('bg').classList.remove('on'); };
$('seg').onclick = function (ev) { var b = ev.target.closest('.chip'); if (b) setType(b.dataset.t); };
$('btnAddItem').onclick = function () { addItem({}); };

// 밴드 형식 글에서 항목을 읽어 칸을 채웁니다.
$('btnParse').onclick = function () {
  var t = $('pasteTxt').value; if (!t.trim()) return;
  if (/#\s*보수일정/.test(t)) setType('보수일정'); else if (/#\s*시공일정/.test(t)) setType('시공일정');
  var m = t.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*(?:[~\-]\s*(\d{1,2}))?\s*일/);
  if (m) { var p2 = function (n) { return ('0' + n).slice(-2); }; $('fDate').value = m[1] + '-' + p2(m[2]) + '-' + p2(m[3]); $('fEnd').value = m[4] ? m[1] + '-' + p2(m[2]) + '-' + p2(m[4]) : ''; }
  var keys = ['담당자', '업체명', '현장명', '주소', '내용', '소장', '인원', '기타'], got = {};
  var re = new RegExp('(' + keys.join('|') + ')\\s*[:：]', 'g'), marks = [], x;
  while ((x = re.exec(t))) marks.push({ k: x[1], s: x.index, e: re.lastIndex });
  marks.forEach(function (mk, i) { if (!got[mk.k]) got[mk.k] = t.slice(mk.e, i + 1 < marks.length ? marks[i + 1].s : t.length).trim(); });
  if (got['담당자'] !== undefined) {
    var who = got['담당자'], cl = S.cfg.clients.filter(function (c) { return who.indexOf(c) === 0; })[0];
    $('fClient').value = cl || ''; $('fManager').value = cl ? who.slice(cl.length).trim() : who;
  }
  if (got['업체명'] !== undefined) $('fCompany').value = got['업체명'];
  if (got['현장명'] !== undefined) $('fSite').value = got['현장명'];
  if (got['주소'] !== undefined) $('fAddr').value = got['주소'].replace(/\s*\n\s*/g, ' ');
  if (got['소장'] !== undefined) $('fChief').value = got['소장'].replace(/\s*\n\s*/g, ' ');
  if (got['기타'] !== undefined) $('fNote').value = got['기타'].replace(/[ \t]+(?=\d{1,2}\.\s)/g, '\n').trim();
  if (got['내용'] !== undefined) {
    var body = got['내용'].replace(/\s*\n\s*/g, ' '), q = body.match(/([\d,]+(?:\.\d+)?)\s*(m2|㎡|m²|장|박스|통|롤)/i);
    $('items').innerHTML = '';
    addItem({ name: body, qty: q ? q[1].replace(/,/g, '') : '', unit: q ? q[2].replace(/㎡|m²/, 'm2') : '' });
  }
  if (got['인원'] !== undefined) {
    var ws = got['인원'].split(/[,\s]+/).filter(String), known = [], etc = [], buf = [];
    ws.forEach(function (w) { if (S.cfg.workers.indexOf(w) >= 0) known.push(w); else buf.push(w); });
    if (buf.length) etc.push(buf.join(' '));
    drawWorkers(known); $('fWorkerEtc').value = etc.join(', ');
  }
  toast('칸을 채웠습니다. 내용을 확인해 주세요');
};

$('btnSave').onclick = function () {
  var bond = F.type === '화성본드';
  if (!$('fDate').value) { toast('일자를 입력해 주세요'); return; }
  if (!bond && !$('fSite').value.trim()) { toast('현장명을 입력해 주세요'); return; }
  var end = $('fEnd').value;
  if (!bond && end && end < $('fDate').value) { toast('종료일이 일자보다 빠릅니다'); return; }
  var workers = S.cfg.workers.filter(function (w) { return F.picked[w]; });
  $('fWorkerEtc').value.split(',').forEach(function (w) { w = w.trim(); if (w) workers.push(w); });
  var d = {
    id: F.id, type: F.type, date: $('fDate').value, endDate: bond ? '' : end,
    client: $('fClient').value, manager: $('fManager').value, company: $('fCompany').value,
    site: $('fSite').value, address: $('fAddr').value, items: readItems(),
    chief: $('fChief').value, workers: workers.join(', '), note: $('fNote').value,
    author: $('fAuthor').value.trim(), keep: F.keep.map(function (p) { return p.f; }), photos: F.news
  };
  if (!bond) {
    d.keepFiles = F.fkeep.map(function (f) { return f.id; });
    d.files = F.fnews.map(function (f) { return { name: f.name, mime: f.mime, data: f.data }; });
  }
  store('hia_author', d.author);
  var btn = $('btnSave'); btn.disabled = true; btn.textContent = (!bond && F.fnews.length) ? '파일 올리는 중…' : F.news.length ? '사진 올리는 중…' : '저장 중…';
  call('saveEntry', d).then(function () {
    $('bg').classList.remove('on'); toast(F.id ? '수정했습니다' : '등록했습니다. 시트에 정리되었습니다'); load();
  }).catch(function (e) { toast('저장하지 못했습니다: ' + (e && e.message || e)); })
    .then(function () { btn.disabled = false; btn.textContent = F.id ? '수정 저장' : '등록하기'; });
};

// 선택 목록: 설정 탭의 거래처 · 단위 · 인원을 눌러서 고릅니다 (아이폰에서도 보이도록 직접 그립니다).
var SG = { inp: null, items: [], idx: -1, skip: false };
function sugList(inp) {
  var k = inp.dataset.sug, all = (S.cfg && S.cfg[k]) || [], q = inp.value.trim().toLowerCase();
  if (!q) return all.slice();
  var hit = all.filter(function (v) { return v.toLowerCase().indexOf(q) >= 0; });
  return hit.length === 1 && hit[0].toLowerCase() === q ? [] : hit;
}
function sugPlace() {
  var box = $('sug'), inp = SG.inp;
  if (!inp || !box.classList.contains('on')) return;
  var r = inp.getBoundingClientRect(), vv = window.visualViewport, vh = vv ? vv.height + vv.offsetTop : window.innerHeight;
  if (r.bottom < 0 || r.top > vh) { sugHide(); return; }
  var w = Math.max(r.width, 160), left = Math.min(r.left, window.innerWidth - w - 8);
  box.style.left = Math.max(8, left) + 'px'; box.style.width = w + 'px';
  var below = vh - r.bottom - 10, above = r.top - 10;
  if (below < 160 && above > below) { box.style.top = ''; box.style.bottom = (window.innerHeight - r.top + 4) + 'px'; box.style.maxHeight = Math.min(240, above) + 'px'; }
  else { box.style.bottom = ''; box.style.top = (r.bottom + 4) + 'px'; box.style.maxHeight = Math.min(240, Math.max(120, below)) + 'px'; }
}
function sugShow(inp) {
  SG.inp = inp; SG.items = sugList(inp); SG.idx = -1;
  var box = $('sug');
  if (!SG.items.length) { sugHide(); return; }
  box.innerHTML = SG.items.map(function (v, i) { return '<button type="button" data-i="' + i + '">' + esc(v) + '</button>'; }).join('');
  box.classList.add('on'); box.scrollTop = 0; sugPlace();
}
function sugHide() { $('sug').classList.remove('on'); SG.idx = -1; }
function sugPick(i) {
  var inp = SG.inp, v = SG.items[i];
  if (!inp || v == null) return;
  inp.value = v; sugHide();
  inp.dispatchEvent(new Event('change', { bubbles: true }));
}
$('sug').addEventListener('mousedown', function (ev) { ev.preventDefault(); });
$('sug').addEventListener('click', function (ev) { var b = ev.target.closest('button[data-i]'); if (b) sugPick(+b.dataset.i); });
document.addEventListener('focusin', function (ev) { var t = ev.target; if (t.matches && t.matches('input[data-sug]')) sugShow(t); });
document.addEventListener('input', function (ev) { var t = ev.target; if (t.matches && t.matches('input[data-sug]')) sugShow(t); });
document.addEventListener('focusout', function (ev) {
  if (ev.target === SG.inp) setTimeout(function () { if (document.activeElement !== SG.inp) sugHide(); }, 220);
});
document.addEventListener('keydown', function (ev) {
  if (!SG.inp || ev.target !== SG.inp || !$('sug').classList.contains('on')) return;
  var n = SG.items.length;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault(); SG.idx = (SG.idx + (ev.key === 'ArrowDown' ? 1 : -1) + n) % n;
    $('sug').querySelectorAll('button').forEach(function (b, i) { b.classList.toggle('act', i === SG.idx); if (i === SG.idx) b.scrollIntoView({ block: 'nearest' }); });
  } else if (ev.key === 'Enter' && SG.idx >= 0) { ev.preventDefault(); sugPick(SG.idx); }
  else if (ev.key === 'Escape') sugHide();
});
window.addEventListener('scroll', function (ev) { if (ev.target !== $('sug')) sugPlace(); }, true);
window.addEventListener('resize', sugPlace);
if (window.visualViewport) window.visualViewport.addEventListener('resize', sugPlace);

// 접속코드는 저장하지 않습니다. 웹앱을 열 때마다 입력해야 내용이 보입니다.
try { localStorage.removeItem('hia_code'); } catch (e) {}
$('gateForm').onsubmit = function (ev) {
  ev.preventDefault();
  var box = $('gateCode'), btn = $('gateBtn'), v = box.value.trim();
  if (!v) { box.focus(); return; }
  S.code = v; btn.disabled = true; btn.textContent = '확인 중…'; $('gateMsg').textContent = '';
  load(function (ok, msg) {
    btn.disabled = false; btn.textContent = '들어가기'; box.value = '';
    if (ok) { $('gate').classList.add('off'); box.blur(); return; }
    S.code = ''; $('gateMsg').textContent = msg;
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); box.focus();
  });
};
$('sub').textContent = '접속코드 필요';
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
